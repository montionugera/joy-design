name: CI/CD — Joymify Design System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/montionugera/joy-design

jobs:
  # ── Job 1: Build & Unit Verification ─────────────────────
  build:
    name: 🔨 Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Integration Checks
        run: ./scripts/integration.sh

  # ── Job 2: Build & Push Image to GHCR ─────────────────────
  build-push-image:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag (short SHA)
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Vultr Kubernetes ────────────────────
  deploy:
    name: 🚀 Deploy to Vultr K8s
    runs-on: ubuntu-latest
    needs: build-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::KUBECONFIG_B64 secret is missing or empty."
            exit 1
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Preflight — ghcr-pull image-pull Secret exists
        run: |
          if ! kubectl get secret ghcr-pull -n default >/dev/null 2>&1; then
            echo "::error::Secret 'ghcr-pull' is missing in target cluster."
            exit 1
          fi
          echo "✅ ghcr-pull present"

      - name: Pin image tag in deployment manifest
        run: |
          IMAGE_TAG="${{ needs.build-push-image.outputs.image_tag }}"
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|g" k8s/deployment.yml
          echo "Applying image ${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Dry-run validate manifests
        run: |
          kubectl apply -f k8s/deployment.yml --dry-run=server -o name
          kubectl apply -f k8s/service.yml    --dry-run=server -o name
          kubectl apply -f k8s/ingress.yml    --dry-run=server -o name

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/ingress.yml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/joy-design-storybook \
            --namespace=default \
            --timeout=180s
