name: CI/CD — Joymify Design System

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  # Deploy fires automatically on push to main (see `deploy` job).
  # workflow_dispatch is the manual escape hatch — ad-hoc redeploy or
  # rollback by passing an explicit image_tag.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Storybook image tag to deploy (e.g. short SHA or "latest"). Leave blank to use latest build from main.'
        required: false
        default: ''
      cli_docs_tag:
        description: 'cli-state-handler release tag whose docs to ship (e.g. v0.2.0). Blank = latest release. Ignored when image_tag is set.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  pull-requests: read # needed by dorny/paths-filter to list PR files

env:
  IMAGE_NAME: ghcr.io/montionugera/joy-design

jobs:
  # ── Detect what changed ───────────────────────────────────
  changes:
    name: 🔍 Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Path filtering
        uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            app:
              - 'packages/**'
              - 'apps/**'
              - 'scripts/**'
              - 'Dockerfile'
              - 'nginx.conf'
              - '.github/workflows/**'
            k8s:
              - 'k8s/**'
              - '.github/workflows/**'

  # ── Job 1: Build & Unit Verification ─────────────────────
  build:
    name: 🔨 Build & Check
    runs-on: ubuntu-latest
    needs: changes
    # Run if app changes, or on PR, or if manually triggered, or if full run
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.app == 'true' ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter storybook-hub exec playwright install --with-deps chromium

      # scripts/lint-colors.sh and its self-test search with ripgrep, which the runner image lacks.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Type check (pnpm check)
        run: pnpm check

      # integration.sh runs Gate 1 (scripts/precheck.sh): emoji policy, strict colour lint
      # (scripts/lint-colors.sh), gate self-tests, contrast test, pnpm check, workspace tests,
      # parity (scripts/parity-check.mjs), hub build and Playwright contracts.
      - name: Gate 1 (scripts/precheck.sh via scripts/integration.sh)
        env:
          GH_TOKEN: ${{ github.token }}   # precheck.sh downloads the cli-state-handler docs it serves
        run: ./scripts/integration.sh

  # ── Job 2: Build & Push Image to GHCR ─────────────────────
  build-push-image:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: [changes, build]
    # Build image on push when app changed, OR on workflow_dispatch when no explicit tag is provided
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && (
        needs.changes.outputs.app == 'true' || needs.changes.outputs.k8s != 'true'
      )) ||
      (github.event_name == 'workflow_dispatch' && inputs.image_tag == '')

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      cli_docs_version: ${{ steps.cli_docs.outputs.cli_docs_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch cli-state-handler docs
        id: cli_docs
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_DOCS_TAG: ${{ inputs.cli_docs_tag }}
        run: bash scripts/fetch-cli-docs.sh "$CLI_DOCS_TAG"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Build Flutter Web Hub
        run: cd apps/flutter-hub && flutter pub get && flutter build web

      - name: Set image tag (short SHA)
        id: meta
        env:
          CLI_DOCS_VERSION: ${{ steps.cli_docs.outputs.cli_docs_version }}
        run: |
          [ -n "$CLI_DOCS_VERSION" ] || { echo "::error::cli docs version is empty; refusing to publish an image tagged without it"; exit 1; }
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          IMAGE_TAG="${SHORT_SHA}-cli${CLI_DOCS_VERSION}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Continuous Deploy to Vultr K8s ─────────────────
  # Runs on every push to main (if app or k8s changed) or manual dispatch
  deploy:
    name: 🚀 Deploy to Vultr K8s
    runs-on: ubuntu-latest
    needs: [changes, build, build-push-image]
    if: |
      !failure() && !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && (
          needs.changes.outputs.app == 'true' ||
          needs.changes.outputs.k8s == 'true'
        )) ||
        github.event_name == 'workflow_dispatch'
      )
    environment: production

    env:
      IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build-push-image.outputs.image_tag || 'latest' }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.29.0'

      - name: 🔐 Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::KUBECONFIG_B64 secret is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: ✅ Verify cluster reachability
        run: |
          kubectl config current-context
          kubectl cluster-info

      - name: 🔍 Preflight — ghcr-pull image-pull Secret exists
        run: |
          if ! kubectl get secret ghcr-pull -n default >/dev/null 2>&1; then
            echo "::error::Secret 'ghcr-pull' is missing in target cluster."
            echo "::error::Ensure ghcr-pull secret is created in default namespace."
            exit 1
          fi
          echo "✅ ghcr-pull present"

      - name: 📌 Pin image tag in deployment manifest
        run: |
          echo "Deploying Storybook Hub: $IMAGE_NAME:$IMAGE_TAG"
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|g" k8s/deployment.yml
          echo "--- pinned manifest image ---"
          grep -E "image: ${IMAGE_NAME}" k8s/deployment.yml

      - name: 🔍 Dry-run validate manifests
        run: |
          kubectl apply -f k8s/deployment.yml --dry-run=server -o name
          kubectl apply -f k8s/service.yml    --dry-run=server -o name
          kubectl apply -f k8s/ingress.yml    --dry-run=server -o name

      - name: 🚀 Apply manifests
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/ingress.yml

      - name: 🔄 Force-roll deployment to ensure fresh pod start
        run: |
          kubectl rollout restart deployment/joy-design-storybook --namespace=default

      - name: ⏳ Wait for rollout
        run: |
          kubectl rollout status deployment/joy-design-storybook \
            --namespace=default \
            --timeout=180s

      - name: 🚦 Smoke check — verify dev.joymify.com & legacy redirect
        env:
          CLI_DOCS_VERSION: ${{ needs.build-push-image.outputs.cli_docs_version }}
        run: |
          EXPECTED_CLI_DOCS_VERSION="$CLI_DOCS_VERSION" ./scripts/smoke-prod.sh dev.joymify.com
          ./scripts/smoke-prod.sh design.joymify.com

      - name: 📋 Deploy summary
        if: always()
        run: |
          echo "## 🚀 Joymify Design System Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`$IMAGE_NAME:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- Endpoint: [https://dev.joymify.com](https://dev.joymify.com)" >> $GITHUB_STEP_SUMMARY
          echo "- Legacy Alias: [https://design.joymify.com](https://design.joymify.com) (HTTP 301)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          kubectl get deployments joy-design-storybook -n default -o wide >> $GITHUB_STEP_SUMMARY || true
