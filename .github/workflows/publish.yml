name: Publish packages to GitHub Packages

# Publishes @montionugera/joy-tokens, joy-icons, joy-brand and joy-react.
# A published version is permanent, so this runs only on a deliberate act:
# a pushed tag matching packages-v*, or a manual run. Manual runs default to a dry run.
on:
  push:
    tags:
      - 'packages-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: gate, build and tarball test, then pnpm publish --dry-run. Nothing is published.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write
  # Lets the npmjs.org step exchange this run's OIDC identity for a short-lived publish token.
  id-token: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

env:
  REGISTRY_URL: https://npm.pkg.github.com
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

jobs:
  publish:
    name: Gate, build, test, publish
    runs-on: ubuntu-latest
    # The GitHub environment `packages` limits this job to the main branch and packages-v* tags
    # (a repository setting, not part of this file). A manual dry run from another branch is rejected.
    environment: packages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # A real publish must come from a commit that is on main. Dry runs may run from any branch.
      - name: Refuse a commit that is not on main
        if: env.DRY_RUN == 'false'
        run: |
          # Checkout used fetch-depth 0 and persist-credentials false, so origin/main is already
          # here, and asking the private origin again would fail to authenticate.
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null || { echo "::error::origin/main was not fetched by checkout."; exit 1; }
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Publish only from a commit that has been merged to main."
            exit 1
          fi
          echo "$GITHUB_SHA is on main."

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@montionugera'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter storybook-hub exec playwright install --with-deps chromium

      # scripts/lint-colors.sh and its self-test search with ripgrep, which the runner image lacks.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      # The gate rebuilds tokens and, through turbo's ^build edge on check, the brand assets.
      - name: Gate (scripts/precheck.sh via scripts/integration.sh)
        run: ./scripts/integration.sh

      # Only joy-icons and joy-react are built here; their dist/ is untracked.
      - name: Build joy-icons and joy-react
        run: |
          pnpm --filter @montionugera/joy-icons build
          pnpm --filter @montionugera/joy-react build

      - name: Tarball test (scripts/test/consumer-smoke.sh)
        run: ./scripts/test/consumer-smoke.sh

      # The bytes published must be the bytes in git: fail if untracked or modified files were left.
      - name: Check the tree is unchanged
        run: |
          if ! test -z "$(git status --porcelain)"; then
            echo "::error::The working tree is not clean. Gate, build, or tests modified or created files."
            git status --short
            exit 1
          fi
          echo "Working tree is clean."

      - name: Check the tag matches the package versions
        if: github.ref_type == 'tag'
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#packages-v}"
          if [ "$tag" = "$version" ]; then
            echo "::error::Tag $tag does not start with packages-v"
            exit 1
          fi
          matched=false
          for pkg in packages/*/package.json; do
            pkg_ver="$(node -p "require('./$pkg').version" 2>/dev/null || true)"
            if [ -n "$pkg_ver" ] && [ "$pkg_ver" = "$version" ]; then
              matched=true
              break
            fi
          done
          if [ "$matched" != "true" ]; then
            echo "::error::Tag $tag ($version) does not match the version of any packages/*/package.json"
            exit 1
          fi
          echo "Tag $tag matches at least one package version ($version)."

      - name: Dry run (nothing is published)
        if: env.DRY_RUN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          echo "## Dry run: nothing was published" >> "$GITHUB_STEP_SUMMARY"
          for dir in tokens icons brand react; do
            name="@montionugera/joy-$dir"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            echo "::group::$name@$version"
            (cd "packages/$dir" && pnpm publish --dry-run --no-git-checks)
            mkdir -p "$RUNNER_TEMP/packs/$dir"
            (cd "packages/$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packs/$dir" > /dev/null)
            echo "Tarball file list for $name@$version:"
            tar -tzf "$RUNNER_TEMP/packs/$dir"/*.tgz | sort
            echo "::endgroup::"
            echo "- \`$name@$version\`: $(tar -tzf "$RUNNER_TEMP/packs/$dir"/*.tgz | wc -l | tr -d ' ') files" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Publish the versions not yet on the registry
        if: env.DRY_RUN == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Publish" >> "$GITHUB_STEP_SUMMARY"
          published=0
          for dir in tokens icons brand react; do
            name="@montionugera/joy-$dir"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            err="$RUNNER_TEMP/npm-view-$dir.err"
            set +e
            found="$(npm view "$name@$version" version --registry "$REGISTRY_URL" 2> "$err")"
            code=$?
            set -e
            if [ "$code" -eq 0 ] && [ "$found" = "$version" ]; then
              echo "$name@$version is already on the registry: skipped."
              echo "- \`$name@$version\`: already published, skipped" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ "$code" -ne 0 ] && ! grep -q 'E404' "$err"; then
              echo "::error::Could not ask the registry about $name@$version (npm view exit $code)."
              cat "$err"
              exit 1
            fi
            echo "Publishing $name@$version"
            (cd "packages/$dir" && pnpm publish --no-git-checks)
            published=$((published + 1))
            echo "- \`$name@$version\`: published" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$published" -eq 0 ]; then
            echo "::error::nothing to publish"
            exit 1
          fi

      - name: Verify each version is on the registry
        if: env.DRY_RUN == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dir in tokens icons brand react; do
            name="@montionugera/joy-$dir"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            found=""
            for attempt in 1 2 3 4 5; do
              echo "Asking the registry for $name@$version (attempt $attempt of 5)"
              found="$(npm view "$name@$version" version --registry "$REGISTRY_URL" 2> /dev/null || true)"
              if [ "$found" = "$version" ]; then break; fi
              sleep 5
            done
            if [ "$found" != "$version" ]; then
              echo "::error::$name@$version is not visible on the registry after publish."
              exit 1
            fi
            echo "$name@$version is on the registry."
          done

      # Also publish the public copies to npmjs.org with trusted publishing (OIDC): npmjs trusts this
      # workflow directly, so no token is stored. Each package needs a trusted publisher on npmjs.com
      # (repo montionugera/joy-design, workflow publish.yml, environment packages); see the README.
      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1, hence the second setup-node.
      - name: Use Node 22 for npmjs.org trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npmjs.org (trusted publishing)
        # Optional public mirror, as in node-server-decorator: the GitHub Packages publish above is
        # the release of record, so a failure here (for example a package whose trusted publisher
        # is not set up yet) is reported as a warning and does not fail the run.
        continue-on-error: true
        run: |
          npm install -g 'npm@^11.5.1'
          NPMJS_URL=https://registry.npmjs.org
          packs="$RUNNER_TEMP/npmjs"
          rm -rf "$packs"
          mkdir -p "$packs"
          # publishConfig.registry in a tarball's package.json would send the upload back to GitHub
          # Packages, so rewrite it for this step only. The files are restored on exit, which keeps
          # the tree clean. A scope mapping beats publishConfig, so pin the scope to npmjs too.
          trap 'git checkout -- packages/tokens/package.json packages/icons/package.json packages/brand/package.json packages/react/package.json' EXIT
          for dir in tokens icons brand react; do
            node -e "const f='packages/$dir/package.json',p=require('./'+f);p.publishConfig={registry:'$NPMJS_URL'};require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          done
          echo "## npmjs.org" >> "$GITHUB_STEP_SUMMARY"
          # The first setup-node wrote @montionugera:registry=<GitHub Packages> into the user config,
          # and npm reads a scope registry before --registry and publishConfig. Pin the scope on
          # every npm call and print the result so the log shows where uploads go.
          SCOPE_PIN="--@montionugera:registry=$NPMJS_URL"
          echo "Scope registry used by this step: $(npm config get @montionugera:registry $SCOPE_PIN)"
          rc=0
          # Same order as the GitHub Packages publish: brand and react depend on tokens and icons.
          # Stop at the first package that fails, so a later package is never published pinned to a
          # dependency version that is not on npmjs.org.
          for dir in tokens icons brand react; do
            name="@montionugera/joy-$dir"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            # An unauthenticated read straight from npmjs.org: no npm config or placeholder token can
            # redirect it or turn a missing package into a 401.
            status="$(curl -s -o /dev/null -w '%{http_code}' "$NPMJS_URL/@montionugera%2fjoy-$dir/$version" || true)"
            if [ "$status" = "200" ]; then
              echo "$name@$version is already on npmjs.org: skipped."
              echo "- \`$name@$version\`: already on npmjs.org, skipped" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ "$status" != "404" ]; then
              echo "::warning::Could not ask npmjs.org about $name@$version (HTTP $status). Stopping."
              echo "- \`$name@$version\`: npmjs.org lookup failed (HTTP $status), stopped" >> "$GITHUB_STEP_SUMMARY"
              rc=1
              break
            fi
            # pnpm packs (it turns workspace:* into real versions); npm uploads (OIDC lives in npm).
            (cd "packages/$dir" && pnpm pack --pack-destination "$packs")
            tgz="$(ls "$packs"/montionugera-joy-"$dir"-*.tgz)"
            if [ "$DRY_RUN" = "true" ]; then
              if npm publish "$tgz" --access public --registry "$NPMJS_URL" $SCOPE_PIN --dry-run; then
                echo "- \`$name@$version\`: npmjs.org dry run" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::npmjs.org dry run failed for $name@$version. Stopping."
                rc=1
                break
              fi
            elif npm publish "$tgz" --access public --registry "$NPMJS_URL" $SCOPE_PIN; then
              echo "- \`$name@$version\`: published to npmjs.org" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$name@$version was not published to npmjs.org. Stopping."
              echo "- \`$name@$version\`: npmjs.org publish FAILED, stopped" >> "$GITHUB_STEP_SUMMARY"
              rc=1
              break
            fi
          done
          exit "$rc"
