<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 780" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="28" fill="#f8fafc" font-size="18" font-weight="bold" letter-spacing="0.5">Joymify Design System — Ant Design 5 Quality Bar &amp; Fluid Transitions Architecture</text>

  <!-- Container A: Runtime Pipeline -->
  <rect x="40" y="40" width="1640" height="280" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="2" filter="url(#glow)"/>
  <rect x="40" y="40" width="1640" height="36" rx="8" fill="#1e293b"/>
  <rect x="40" y="68" width="1640" height="8" fill="#1e293b"/>
  <text x="60" y="64" fill="#38bdf8" font-size="14" font-weight="bold">PIPELINE A: Interactive Trigger &amp; Popover Runtime Pipeline</text>

  <!-- Nodes A -->
  <!-- 1. Unified Trigger Pill -->
  <g transform="translate(80, 110)">
    <rect width="220" height="80" rx="8" fill="#1e2230" stroke="#fbbf24" stroke-width="2"/>
    <text x="110" y="30" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Unified Trigger Pill</text>
    <text x="110" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">[ Start Date -&gt; End Date (x) [cal] ]</text>
    <text x="110" y="64" fill="#64748b" font-size="10" text-anchor="middle">Focus Ring &amp; Hover States</text>
  </g>

  <!-- Connector A1 -->
  <path d="M 300 150 L 350 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="305" y="139" width="40" height="18" rx="4" fill="#0d1527" stroke="#38bdf8" stroke-width="1"/>
  <text x="325" y="152" fill="#38bdf8" font-size="9" text-anchor="middle" font-weight="bold">Trigger</text>

  <!-- 2. Floating Overlay Engine -->
  <g transform="translate(350, 110)">
    <rect width="230" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="115" y="30" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Floating Overlay Engine</text>
    <text x="115" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">useOverlay / overlay-utils</text>
    <text x="115" y="64" fill="#64748b" font-size="10" text-anchor="middle">Anchored Alignment &amp; Viewport</text>
  </g>

  <!-- Connector A2 -->
  <path d="M 580 150 L 630 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="585" y="139" width="40" height="18" rx="4" fill="#0d1527" stroke="#38bdf8" stroke-width="1"/>
  <text x="605" y="152" fill="#38bdf8" font-size="9" text-anchor="middle" font-weight="bold">Anchor</text>

  <!-- 3. Motion & Transition Choreography -->
  <g transform="translate(630, 110)">
    <rect width="230" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="115" y="30" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Motion &amp; Choreography</text>
    <text x="115" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">scale-in + opacity fade</text>
    <text x="115" y="64" fill="#64748b" font-size="10" text-anchor="middle">--joy-ease-out-quint &amp; Origin</text>
  </g>

  <!-- Connector A3 -->
  <path d="M 860 150 L 910 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="865" y="139" width="40" height="18" rx="4" fill="#0d1527" stroke="#38bdf8" stroke-width="1"/>
  <text x="885" y="152" fill="#38bdf8" font-size="9" text-anchor="middle" font-weight="bold">Animate</text>

  <!-- 4. Calendar Panels (Single / Dual) -->
  <g transform="translate(910, 110)">
    <rect width="230" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="115" y="30" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Calendar Panels (Dual/Single)</text>
    <text x="115" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">Header: &lt;&lt; &lt; Month Year &gt; &gt;&gt;</text>
    <text x="115" y="64" fill="#64748b" font-size="10" text-anchor="middle">7x6 Days Matrix &amp; Presets</text>
  </g>

  <!-- Connector A4 -->
  <path d="M 1140 150 L 1190 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="1145" y="139" width="40" height="18" rx="4" fill="#0d1527" stroke="#38bdf8" stroke-width="1"/>
  <text x="1165" y="152" fill="#38bdf8" font-size="9" text-anchor="middle" font-weight="bold">Mount</text>

  <!-- 5. Accessibility & Roving Tabindex -->
  <g transform="translate(1190, 110)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="110" y="30" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">A11y &amp; Keyboard Roving</text>
    <text x="110" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">role='grid' / role='gridcell'</text>
    <text x="110" y="64" fill="#64748b" font-size="10" text-anchor="middle">Arrows Nav, Enter &amp; Escape</text>
  </g>

  <!-- Connector A5 -->
  <path d="M 1410 150 L 1460 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="1415" y="139" width="40" height="18" rx="4" fill="#0d1527" stroke="#38bdf8" stroke-width="1"/>
  <text x="1435" y="152" fill="#38bdf8" font-size="9" text-anchor="middle" font-weight="bold">Render</text>

  <!-- 6. Rendered Screen Matrix -->
  <g transform="translate(1460, 110)">
    <rect width="180" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="30" fill="#a7f3d0" font-size="13" font-weight="bold" text-anchor="middle">Rendered Screen</text>
    <text x="90" y="48" fill="#6ee7b7" font-size="11" text-anchor="middle">Dark &amp; Light 100%</text>
    <text x="90" y="64" fill="#34d399" font-size="10" text-anchor="middle">Desktop &amp; Touch Bounds</text>
  </g>

  <!-- Container B: Deep Lifecycle & Parity Loop -->
  <rect x="40" y="380" width="1640" height="340" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="2" filter="url(#glow)"/>
  <rect x="40" y="380" width="1640" height="36" rx="8" fill="#1e293b"/>
  <rect x="40" y="408" width="1640" height="8" fill="#1e293b"/>
  <text x="60" y="404" fill="#fbbf24" font-size="14" font-weight="bold">PIPELINE B: State Lifecycle, Range Trail &amp; Twin Contract Loop</text>

  <!-- Nodes B -->
  <!-- 1. State Store -->
  <g transform="translate(80, 450)">
    <rect width="220" height="80" rx="8" fill="#1e2230" stroke="#fbbf24" stroke-width="2"/>
    <text x="110" y="30" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">State Store &amp; Normalizer</text>
    <text x="110" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">value / defaultValue / onChange</text>
    <text x="110" y="64" fill="#64748b" font-size="10" text-anchor="middle">ISO Date (YYYY-MM-DD)</text>
  </g>

  <!-- Connector B1 -->
  <path d="M 300 490 L 350 490" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="305" y="479" width="40" height="18" rx="4" fill="#0d1527" stroke="#fbbf24" stroke-width="1"/>
  <text x="325" y="492" fill="#fbbf24" font-size="9" text-anchor="middle" font-weight="bold">Hover</text>

  <!-- 2. Hover Trail Engine -->
  <g transform="translate(350, 450)">
    <rect width="230" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="115" y="30" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Hover Trail Engine</text>
    <text x="115" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">Active Interval Selection</text>
    <text x="115" y="64" fill="#64748b" font-size="10" text-anchor="middle">Preview Track: Start -&gt; Hover</text>
  </g>

  <!-- Connector B2 -->
  <path d="M 580 490 L 630 490" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="585" y="479" width="40" height="18" rx="4" fill="#0d1527" stroke="#fbbf24" stroke-width="1"/>
  <text x="605" y="492" fill="#fbbf24" font-size="9" text-anchor="middle" font-weight="bold">Tokens</text>

  <!-- 3. Design Token Bindings -->
  <g transform="translate(630, 450)">
    <rect width="230" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="115" y="30" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Design Token Bindings</text>
    <text x="115" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">--joy-surface-card, --joy-text</text>
    <text x="115" y="64" fill="#64748b" font-size="10" text-anchor="middle">--joy-accent-default &amp; 0 Literals</text>
  </g>

  <!-- Connector B3 -->
  <path d="M 860 490 L 910 490" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="865" y="479" width="40" height="18" rx="4" fill="#0d1527" stroke="#fbbf24" stroke-width="1"/>
  <text x="885" y="492" fill="#fbbf24" font-size="9" text-anchor="middle" font-weight="bold">Twin</text>

  <!-- 4. Twin Parity Gate -->
  <g transform="translate(910, 450)">
    <rect width="230" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="115" y="30" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Twin Parity Gate (1:1 API)</text>
    <text x="115" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">React 19 (forwardRef, props)</text>
    <text x="115" y="64" fill="#64748b" font-size="10" text-anchor="middle">Svelte 5 ($props, $state, $derived)</text>
  </g>

  <!-- Connector B4 -->
  <path d="M 1140 490 L 1190 490" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="1145" y="479" width="40" height="18" rx="4" fill="#0d1527" stroke="#fbbf24" stroke-width="1"/>
  <text x="1165" y="492" fill="#fbbf24" font-size="9" text-anchor="middle" font-weight="bold">Showcase</text>

  <!-- 5. Storybook Hub Showcase -->
  <g transform="translate(1190, 450)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="110" y="30" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Storybook Hub Showcase</text>
    <text x="110" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">Interactive Date &amp; Range Demos</text>
    <text x="110" y="64" fill="#64748b" font-size="10" text-anchor="middle">Live Theme Switching (Light/Dark)</text>
  </g>

  <!-- Connector B5 -->
  <path d="M 1410 490 L 1460 490" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="1415" y="479" width="40" height="18" rx="4" fill="#0d1527" stroke="#fbbf24" stroke-width="1"/>
  <text x="1435" y="492" fill="#fbbf24" font-size="9" text-anchor="middle" font-weight="bold">Gate 1</text>

  <!-- 6. Gate 1 Precheck Verification -->
  <g transform="translate(1460, 450)">
    <rect width="180" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="30" fill="#a7f3d0" font-size="13" font-weight="bold" text-anchor="middle">Gate 1 Verified</text>
    <text x="90" y="48" fill="#6ee7b7" font-size="11" text-anchor="middle">lint-colors, parity-check</text>
    <text x="90" y="64" fill="#34d399" font-size="10" text-anchor="middle">Playwright Contracts Exit 0</text>
  </g>
</svg>
