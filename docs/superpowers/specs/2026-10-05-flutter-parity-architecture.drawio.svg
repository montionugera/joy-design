<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 780" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="28" fill="#f8fafc" font-size="18" font-weight="bold" letter-spacing="0.5">Joymify Design System — Flutter Full Component Parity &amp; Cross-Platform E2E Architecture</text>

  <!-- Container A: Runtime Pipeline -->
  <rect x="40" y="40" width="1640" height="280" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="2" filter="url(#glow)"/>
  <rect x="40" y="40" width="1640" height="36" rx="8" fill="#1e293b"/>
  <rect x="40" y="68" width="1640" height="8" fill="#1e293b"/>
  <text x="60" y="64" fill="#38bdf8" font-size="14" font-weight="bold">PIPELINE A: Fast Real-Time Runtime Pipeline (Tokens to UI Rendering)</text>

  <!-- Nodes A -->
  <!-- Token Source -->
  <g transform="translate(80, 110)">
    <rect width="200" height="80" rx="6" fill="#1e2230" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/>
    <text x="100" y="28" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Token Source</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">tokens.json</text>
    <text x="100" y="64" fill="#64748b" font-size="10" text-anchor="middle">Single Source of Truth</text>
  </g>

  <!-- Token Compiler -->
  <g transform="translate(330, 110)">
    <rect width="200" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
    <text x="100" y="28" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Token Compiler</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">build.js &amp; gen-dart.mjs</text>
    <text x="100" y="64" fill="#64748b" font-size="10" text-anchor="middle">JSON → Typed Dart</text>
  </g>

  <!-- Generated Dart Tokens -->
  <g transform="translate(580, 110)">
    <rect width="220" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="110" y="28" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Generated Dart Tokens</text>
    <text x="110" y="48" fill="#e2e8f0" font-size="11" text-anchor="middle">joy_tokens.g.dart</text>
    <text x="110" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">ThemeExtension &amp; Semantics</text>
  </g>

  <!-- Joymify Flutter Library -->
  <g transform="translate(850, 110)">
    <rect width="220" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="110" y="28" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Joymify Flutter Library</text>
    <text x="110" y="48" fill="#e2e8f0" font-size="11" text-anchor="middle">packages/flutter/lib/</text>
    <text x="110" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">~65 Triplet Parity Widgets</text>
  </g>

  <!-- Flutter Semantics & Hit Bounds -->
  <g transform="translate(1120, 110)">
    <rect width="210" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
    <text x="105" y="28" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Semantics &amp; Hit Bounds</text>
    <text x="105" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">44px Coarse Touch Bounds</text>
    <text x="105" y="64" fill="#64748b" font-size="10" text-anchor="middle">Accessible ARIA Tree Nodes</text>
  </g>

  <!-- Target Mobile -->
  <g transform="translate(1410, 80)">
    <rect width="210" height="65" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>
    <text x="105" y="26" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">Native Mobile Apps</text>
    <text x="105" y="46" fill="#6ee7b7" font-size="10" text-anchor="middle">iOS &amp; Android (joy-coach-fe)</text>
  </g>

  <!-- Target Web -->
  <g transform="translate(1410, 175)">
    <rect width="210" height="65" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>
    <text x="105" y="26" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">Flutter Web Showcase</text>
    <text x="105" y="46" fill="#6ee7b7" font-size="10" text-anchor="middle">apps/flutter-hub (Wasm/Canvas)</text>
  </g>

  <!-- Edges A with Label Pills -->
  <path d="M 280 150 L 330 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="285" y="138" width="40" height="16" rx="4" fill="#0d1527"/>
  <text x="305" y="150" fill="#38bdf8" font-size="9" text-anchor="middle">Parse</text>

  <path d="M 530 150 L 580 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="535" y="138" width="40" height="16" rx="4" fill="#0d1527"/>
  <text x="555" y="150" fill="#38bdf8" font-size="9" text-anchor="middle">Emit</text>

  <path d="M 800 150 L 850 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="805" y="138" width="40" height="16" rx="4" fill="#0d1527"/>
  <text x="825" y="150" fill="#38bdf8" font-size="9" text-anchor="middle">Inject</text>

  <path d="M 1070 150 L 1120 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="1075" y="138" width="40" height="16" rx="4" fill="#0d1527"/>
  <text x="1095" y="150" fill="#38bdf8" font-size="9" text-anchor="middle">Enforce</text>

  <path d="M 1330 130 L 1370 130 L 1370 112 L 1410 112" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="1350" y="104" width="45" height="16" rx="4" fill="#0d1527"/>
  <text x="1372" y="116" fill="#38bdf8" font-size="9" text-anchor="middle">Mobile</text>

  <path d="M 1330 170 L 1370 170 L 1370 207 L 1410 207" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="1355" y="199" width="35" height="16" rx="4" fill="#0d1527"/>
  <text x="1372" y="211" fill="#38bdf8" font-size="9" text-anchor="middle">Web</text>


  <!-- Container B: Quality Gate & Release Loop -->
  <rect x="40" y="360" width="1640" height="380" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="2" filter="url(#glow)"/>
  <rect x="40" y="360" width="1640" height="36" rx="8" fill="#1e293b"/>
  <rect x="40" y="388" width="1640" height="8" fill="#1e293b"/>
  <text x="60" y="384" fill="#fbbf24" font-size="14" font-weight="bold">PIPELINE B: Deep Quality Gate, Parity Enforcement &amp; Release Promotion Loop</text>

  <!-- Row 1: Precheck Steps -->
  <!-- Worktree Claim -->
  <g transform="translate(80, 420)">
    <rect width="180" height="80" rx="6" fill="#1e2230" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/>
    <text x="90" y="28" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Worktree Claim</text>
    <text x="90" y="48" fill="#e2e8f0" font-size="11" text-anchor="middle">psrw claim F-NNN</text>
    <text x="90" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">Isolated Feature Worktree</text>
  </g>

  <!-- Gate 1A: Static Analysis -->
  <g transform="translate(310, 420)">
    <rect width="220" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
    <text x="110" y="24" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Gate 1A: Static Integrity</text>
    <text x="110" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">• Zero Emoji Policy (.dart)</text>
    <text x="110" y="56" fill="#94a3b8" font-size="10" text-anchor="middle">• lint-colors.sh (No hex in Dart)</text>
    <text x="110" y="70" fill="#94a3b8" font-size="10" text-anchor="middle">• flutter analyze --fatal-infos</text>
  </g>

  <!-- Gate 1B: Triplet Parity -->
  <g transform="translate(580, 420)">
    <rect width="220" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="110" y="26" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Gate 1B: Triplet Parity</text>
    <text x="110" y="46" fill="#e2e8f0" font-size="11" text-anchor="middle">scripts/parity-check.mjs</text>
    <text x="110" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">React ↔ Svelte ↔ Flutter</text>
  </g>

  <!-- Gate 1C: Unit & Contrast -->
  <g transform="translate(850, 420)">
    <rect width="220" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
    <text x="110" y="26" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Gate 1C: Unit &amp; Contrast</text>
    <text x="110" y="46" fill="#e2e8f0" font-size="11" text-anchor="middle">packages/flutter/test/</text>
    <text x="110" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">WCAG 2.2 AA Contrast Gate</text>
  </g>

  <!-- Unified E2E Contracts -->
  <g transform="translate(1120, 420)">
    <rect width="210" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="105" y="26" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Unified E2E Contracts</text>
    <text x="105" y="46" fill="#e2e8f0" font-size="11" text-anchor="middle">tests/contracts/*.json</text>
    <text x="105" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">Declarative Behavior Specs</text>
  </g>

  <!-- Playwright Cross-Runner -->
  <g transform="translate(1380, 420)">
    <rect width="240" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="120" y="26" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Playwright Cross-Runner</text>
    <text x="120" y="46" fill="#e2e8f0" font-size="11" text-anchor="middle">Web Hub &amp; Flutter Web Hub</text>
    <text x="120" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">Twin Assertions &amp; Snapshot Diff</text>
  </g>

  <!-- Row 2: Shipping, Verification, Promotion -->
  <!-- Gate 1 Ship -->
  <g transform="translate(1380, 580)">
    <rect width="240" height="80" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="120" y="28" fill="#a7f3d0" font-size="13" font-weight="bold" text-anchor="middle">Gate 1 Ship</text>
    <text x="120" y="48" fill="#6ee7b7" font-size="11" text-anchor="middle">psrw ship</text>
    <text x="120" y="64" fill="#a7f3d0" font-size="10" text-anchor="middle">Merge Feature → release/&lt;v&gt;</text>
  </g>

  <!-- Epic Verification -->
  <g transform="translate(1000, 580)">
    <rect width="220" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
    <text x="110" y="28" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Epic Gate Verification</text>
    <text x="110" y="48" fill="#e2e8f0" font-size="11" text-anchor="middle">scripts/epic-check.sh</text>
    <text x="110" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">psrw epic verify</text>
  </g>

  <!-- Gate 2 Promotion -->
  <g transform="translate(580, 580)">
    <rect width="260" height="80" rx="6" fill="#1e2230" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/>
    <text x="130" y="26" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Gate 2 Promotion Babysit</text>
    <text x="130" y="46" fill="#e2e8f0" font-size="11" text-anchor="middle">scripts/integration.sh</text>
    <text x="130" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">psrw promote --babysit (PR to main)</text>
  </g>

  <!-- Production Release -->
  <g transform="translate(180, 580)">
    <rect width="240" height="80" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="120" y="28" fill="#a7f3d0" font-size="13" font-weight="bold" text-anchor="middle">Main Production Release</text>
    <text x="120" y="48" fill="#6ee7b7" font-size="11" text-anchor="middle">v3.0.0 Tagged &amp; Deployed</text>
    <text x="120" y="64" fill="#a7f3d0" font-size="10" text-anchor="middle">joymify_flutter pub.dev/git</text>
  </g>

  <!-- Edges B with Label Pills -->
  <path d="M 260 460 L 310 460" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="265" y="448" width="40" height="16" rx="4" fill="#0d1527"/>
  <text x="285" y="460" fill="#fbbf24" font-size="9" text-anchor="middle">Verify</text>

  <path d="M 530 460 L 580 460" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="535" y="448" width="40" height="16" rx="4" fill="#0d1527"/>
  <text x="555" y="460" fill="#fbbf24" font-size="9" text-anchor="middle">Static</text>

  <path d="M 800 460 L 850 460" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="805" y="448" width="40" height="16" rx="4" fill="#0d1527"/>
  <text x="825" y="460" fill="#fbbf24" font-size="9" text-anchor="middle">Parity</text>

  <path d="M 1070 460 L 1120 460" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="1075" y="448" width="40" height="16" rx="4" fill="#0d1527"/>
  <text x="1095" y="460" fill="#fbbf24" font-size="9" text-anchor="middle">Units</text>

  <path d="M 1330 460 L 1380 460" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="1335" y="448" width="40" height="16" rx="4" fill="#0d1527"/>
  <text x="1355" y="460" fill="#fbbf24" font-size="9" text-anchor="middle">Specs</text>

  <path d="M 1500 500 L 1500 580" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="1480" y="532" width="40" height="16" rx="4" fill="#0d1527"/>
  <text x="1500" y="544" fill="#fbbf24" font-size="9" text-anchor="middle">Pass</text>

  <path d="M 1380 620 L 1220 620" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="1275" y="608" width="50" height="16" rx="4" fill="#0d1527"/>
  <text x="1300" y="620" fill="#fbbf24" font-size="9" text-anchor="middle">Merged</text>

  <path d="M 1000 620 L 840 620" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="890" y="608" width="60" height="16" rx="4" fill="#0d1527"/>
  <text x="920" y="620" fill="#fbbf24" font-size="9" text-anchor="middle">All Slices</text>

  <path d="M 580 620 L 420 620" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <rect x="475" y="608" width="50" height="16" rx="4" fill="#0d1527"/>
  <text x="500" y="620" fill="#fbbf24" font-size="9" text-anchor="middle">Gate 2</text>
</svg>