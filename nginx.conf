# HTTP 301 Permanent Redirect for legacy domain design.joymify.com -> dev.joymify.com/design/
server {
    listen 80;
    server_name design.joymify.com;
    return 301 https://dev.joymify.com/design$request_uri;
}

# Main Virtual Host for Unified Developer Portal & Sub-Webapps
server {
    listen 80 default_server;
    server_name dev.joymify.com _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # 1. Joy Design System Storybook Hub (/design and /design/)
    location = /design {
        return 301 /design/;
    }
    location /design/ {
        try_files $uri $uri/ /design/index.html;
    }

    # 2. Node Server Decorator Starlight docs (/server-decorator and /server-decorator/)
    location = /server-decorator {
        return 301 /server-decorator/;
    }
    location /server-decorator/ {
        try_files $uri $uri/ /server-decorator/index.html;
    }

    # 3. CLI State Handler Vite docs (/cli-state-handler and /cli-state-handler/)
    location = /cli-state-handler {
        return 301 /cli-state-handler/;
    }
    location /cli-state-handler/ {
        try_files $uri $uri/ /cli-state-handler/index.html;
    }

    # Root: Developer Portal Hero Landing Page & shared static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
