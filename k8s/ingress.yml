apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: joy-design-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.org/server-snippets: "gzip on;"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev.joymify.com
      secretName: dev-joymify-tls
    - hosts:
        - design.joymify.com
      secretName: joy-design-tls
  rules:
    - host: dev.joymify.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: joy-design-storybook
                port:
                  number: 80
    - host: design.joymify.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: joy-design-storybook
                port:
                  number: 80
